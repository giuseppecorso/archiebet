<main class="wrap">
  <section class="panel box" aria-labelledby="login-title">
    <div class="logo" aria-hidden="true">
      <span class="led archie">ARCHIE</span>
    </div>
    <h1 id="login-title" class="visually-hidden">Accedi ad Archie</h1>
    <p class="motto">Give me the odds, I'll move the world.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="label">Nome utente</span>
        <input formControlName="username" autocomplete="username" autocapitalize="none" spellcheck="false" />
      </label>
      <label class="field">
        <span class="label">Password</span>
        <input formControlName="password" type="password" autocomplete="current-password" />
      </label>

      @if (error(); as message) {
        <p class="error" role="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle><path d="M12 7v6"></path><path d="M12 17h.01"></path>
          </svg>
          {{ message }}
        </p>
      }

      <button type="submit" class="btn-primary" [disabled]="busy()">{{ busy() ? 'Entro…' : 'Entra' }}</button>
    </form>

    <aside class="demo" aria-label="Account demo">
      <p><strong>Vuoi solo dare un'occhiata?</strong> Entra con l'account demo, in sola lettura.</p>
      <p class="creds">utente <code>{{ demo.username }}</code> · password <code>{{ demo.password }}</code></p>
      <button type="button" class="btn-demo" [disabled]="busy()" (click)="enterDemo()">Entra come ospite</button>
    </aside>
  </section>
</main>
