<section class="panel box" aria-labelledby="h-today">
  <div class="box-head">
    <h2 id="h-today" class="box-title">Partite di oggi</h2>
    <a routerLink="/partite" class="small">Tutte</a>
  </div>
  @for (m of todayMatches(); track m.id) {
    <ab-match-row [match]="m" [headline]="headlines.value()[m.id]" />
  } @empty {
    <p class="muted small">{{ upcoming.isLoading() ? 'Carico…' : 'Oggi niente partite nei campionati seguiti.' }} <a routerLink="/partite">Guarda i prossimi giorni</a></p>
  }
</section>
