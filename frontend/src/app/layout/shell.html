<header class="header">
  <a routerLink="/partite" class="logo" aria-label="ArchieBet, vai alle partite">
    <span class="led logo-archie">ARCHIE</span><span class="title logo-bet">BET</span>
  </a>

  <nav class="nav" aria-label="Sezioni principali">
    @for (section of menu; track section.path) {
      <a
        class="nav-link title"
        [routerLink]="section.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >{{ section.label }}</a
      >
    }
  </nav>

  <div class="tools">
    <a
      class="icon-btn"
      routerLink="/impostazioni"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      aria-label="Impostazioni e limiti di gioco"
      title="Impostazioni e limiti di gioco"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line>
        <circle cx="9" cy="6" r="2" fill="var(--bg-header)"></circle><circle cx="15" cy="12" r="2" fill="var(--bg-header)"></circle><circle cx="7" cy="18" r="2" fill="var(--bg-header)"></circle>
      </svg>
    </a>
    <span class="user">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path>
      </svg>
      {{ auth.user()?.username }}
    </span>
    <button type="button" class="logout" (click)="logout()">Esci</button>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<ab-slip-panel />

<footer class="footer">
  <span class="motto">Give me the odds, I'll move the world.</span>
  <span>Uso privato</span>
</footer>
