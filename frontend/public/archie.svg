<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Archie, il gufo brontolone e sapiente">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#06301f"/>
      <stop offset="0.55" stop-color="#03130c"/>
      <stop offset="1" stop-color="#020705"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eafff5"/>
      <stop offset="0.35" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#00a85a"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00ff88" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <!-- sfondo digitale -->
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
  </g>

  <g id="owl">
    <g fill="#03150d" stroke="#00ff88" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
      <!-- trespolo -->
      <path d="M132 458 H380" fill="none"/>
      <!-- corpo tondo, tutto piume -->
      <path d="M256 100 C150 100 106 192 106 290 C106 398 172 452 256 452 C340 452 406 398 406 290 C406 192 362 100 256 100 Z"/>
      <!-- ciuffo spettinato -->
      <path d="M238 102 L246 78 L256 98 L268 74 L274 102" fill="none"/>
      <!-- ali raccolte -->
      <path d="M124 264 C92 322 104 396 160 434 C142 386 140 324 152 278 Z"/>
      <path d="M388 264 C420 322 408 396 352 434 C370 386 372 324 360 278 Z"/>
      <!-- occhi grandi -->
      <circle cx="196" cy="240" r="50" fill="#010403"/>
      <circle cx="316" cy="240" r="50" fill="#010403"/>
    </g>

    <!-- piume del petto -->
    <g fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <path d="M220 346 q12 14 24 0 M268 346 q12 14 24 0"/>
      <path d="M196 374 q12 14 24 0 M244 374 q12 14 24 0 M292 374 q12 14 24 0"/>
      <path d="M220 402 q12 14 24 0 M268 402 q12 14 24 0"/>
    </g>

    <!-- mirino negli occhi -->
    <g fill="none" stroke="#00ff88" stroke-width="3" opacity="0.5">
      <circle cx="196" cy="240" r="36" stroke-dasharray="6 9"/>
      <circle cx="316" cy="240" r="36" stroke-dasharray="6 9"/>
    </g>

    <g filter="url(#glow)">
      <!-- pupille accese, sguardo severo verso il centro -->
      <circle cx="202" cy="250" r="19" fill="url(#eye)"/>
      <circle cx="310" cy="250" r="19" fill="url(#eye)"/>
      <!-- becco piccolo e adunco -->
      <path d="M256 266 C240 274 240 300 256 316 C272 300 272 274 256 266 Z" fill="#00ff88"/>
      <!-- zampe sul trespolo -->
      <path d="M220 448 v12 M232 448 v12 M244 448 v12 M268 448 v12 M280 448 v12 M292 448 v12" fill="none" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- sopracciglia folte a V: il cipiglio da brontolone -->
    <g fill="#03150d" stroke="#00ff88" stroke-width="7" stroke-linejoin="round" filter="url(#glow)">
      <path d="M256 230 C216 180 150 136 80 114 C100 148 116 178 138 206 C180 194 224 202 256 230 Z"/>
      <path d="M256 230 C296 180 362 136 432 114 C412 148 396 178 374 206 C332 194 288 202 256 230 Z"/>
    </g>
    <circle cx="196" cy="243" r="4.5" fill="#fff"/>
    <circle cx="304" cy="243" r="4.5" fill="#fff"/>
  </g>
</svg>
