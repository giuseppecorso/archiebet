server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API: al container del backend
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;  # i giudizi dell'AI possono superare il minuto
  }

  # File con l'impronta nel nome: non cambiano mai, il browser non deve ricontrollarli
  location ~ ^/(chunk|main|styles|polyfills)-[^/]+\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Rotte di Angular: ogni indirizzo che non è un file torna a index.html
  location / {
    # Si ricontrolla sempre: dopo un aggiornamento il telefono vede subito la versione nuova
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
