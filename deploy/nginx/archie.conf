# Copia documentativa: il file vero sta sul server in /etc/nginx/sites-available/archie (non è gestito da update.sh).
# Nginx dell'host gestisce HTTPS (Certbot) e passa tutto a Caddy, che ascolta solo su 127.0.0.1:8090.
# Le righe ssl_* e il blocco di redirect da HTTP a HTTPS li aggiunge Certbot sul server.
server {
    server_name archie.giuseppecorso.it;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
